services:
  mariadb:
      build: requirements/mariadb
      container_name: mariadb
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
        MYSQL_USER: ${MYSQL_USER}
        MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      volumes:
        - mariadb_vol:/var/lib/mysql
      networks:
        - inception
      restart: always

networks:
  inception:
    driver: bridge

volumes:
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WP_DATA_PATH}
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DB_DATA_PATH}